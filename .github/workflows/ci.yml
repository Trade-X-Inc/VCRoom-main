name: CI

# Runs on every push and PR targeting main. A PR trigger already covers
# every feature branch by construction — this repo's branches use no
# single consistent naming prefix (r10-*, fix/*, perf/*, phase0/*,
# internal-app/*, profile-founder/*, ...), so pattern-matching branch
# names would either miss real branches or need constant upkeep. Pushing
# straight to a feature branch (not yet a PR) also runs the checks, via
# the `push` trigger's branch list below — add a branch there only if it
# needs checks before a PR exists; main is always covered.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# All real app code lives in frontend/ — the repo root's package.json is
# a stale, unrelated 4-line i18next stub with no scripts (pre-dates the
# current app, never wired to anything real). Every job below runs with
# working-directory: frontend, not the repo root.
defaults:
  run:
    working-directory: frontend

jobs:
  grant-guard:
    name: Migration grant guard
    runs-on: ubuntu-latest
    steps:
      # No longer needs fetch-depth: 0 — this guard scans the WHOLE
      # supabase/migrations directory every run (see
      # frontend/scripts/check-grants.mjs's header for why diff-scoping
      # was dropped on 9 Oct 2026: a direct push to main has
      # HEAD==origin/main, so a diff-scoped scan found nothing to check
      # on exactly the trigger meant to catch a post-merge regression).
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Self-tests run BEFORE the real guard — a guard whose own
      # detection rules are unproven is not something to gate a build
      # on. One bad + one good fixture per rule (R1-R10), plus a named
      # regression test for the file-wide-ALTER-DEFAULT-PRIVILEGES false
      # negative this guard's prior version shipped with on its very
      # first adversarial review.
      - run: node scripts/check-grants.test.mjs
      - run: node scripts/check-grants.mjs

  serverfn-authz-guard:
    name: Server-fn service-role auth guard
    runs-on: ubuntu-latest
    steps:
      # Added 11 Oct 2026 after an audit found five createServerFn
      # handlers in src/lib using the service-role client (which
      # bypasses RLS entirely, CLAUDE.md §7.1) while trusting a
      # client-supplied id with no identity cross-check — one of them
      # (deal-room-workflow-fn.ts's getDealRoomWorkflow) had NO identity
      # derivation at all: any caller, authenticated or not, got any
      # deal room's full term-sheet state. Fixed same session; this
      # guard is the regression gate. Uses the real TypeScript compiler
      # API (not regex) to find every exported createServerFn(...)
      # .handler(...) in src/lib (excluding src/lib/actions/, which has
      # its own separate chokepoint guarantee enforced by
      # check-action-split.mjs below) and fails if a handler uses a
      # service-role client with no call to a recognised auth helper
      # anywhere in its body. See scripts/check-serverfn-authz.mjs's own
      # header for exactly what this can and cannot prove — it is a
      # structural "is there an auth call at all" check, not a full
      # per-id cross-check audit.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Self-tests first (a failing and a passing example for every rule), then the real guard over the source.
      - run: node scripts/check-serverfn-authz.test.mjs
      - run: node scripts/check-serverfn-authz.mjs

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # CORRECTED before this went live: a bare `npx tsc --noEmit` exits
      # non-zero the moment ANY error exists — it has no concept of
      # "pre-existing" vs "new". This project carries a known, tracked
      # set of pre-existing errors (currently 55, CLAUDE.md §5's
      # baseline table); a raw tsc CI step would be red on its very
      # first run and stay red regardless of whether a PR introduces a
      # real regression. scripts/check-tsc-baseline.mjs reproduces this
      # session's own manual practice — an error-SET diff against the
      # tracked baseline (scripts/tsc-baseline.txt), not a bare exit
      # code or count (two different 55-sized error sets is not a pass
      # — CLAUDE.md §20.3). Fails only on a genuinely NEW error; a
      # SHRUNK baseline (an error got fixed) passes and prints a
      # reminder to update the baseline file, matching CLAUDE.md §5's
      # own "if it drops, update this line and record why" convention.
      # Verified against three real scenarios before wiring in: parity
      # (pass), a real injected new error (correctly fails), and a
      # simulated fix (baseline shrinks, correctly passes).
      - run: node scripts/check-tsc-baseline.mjs

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # `npm run build` runs `vite build` then (via the package.json
      # "postbuild" script) `node scripts/patch-wrangler.mjs`, which
      # itself invokes `node scripts/check-action-split.mjs` and exits
      # non-zero if it fails (CLAUDE.md §20.11's build gate — verifies
      # every gateway action binds through runAction and that zero
      # pack_api handler bodies leak into the client bundle). This is
      # the same script this project has run manually before every
      # verified change all session. It is NOT wired in separately below
      # — it already runs as part of this one `npm run build` call, and
      # a failure here already fails this job. Do not add a second,
      # separate "action-split guard" step; that would just re-run part
      # of this same build and could silently drift from what postbuild
      # actually does.
      - run: npm run build
      # Ceiling check, matching CLAUDE.md §5's own bundle rule (CF Pages
      # hard limit is 1 MB gzip; the worker's own build output already
      # prints "_worker.js gzip size" and warns internally, but nothing
      # in the build script currently fails CI on it — this step is the
      # actual gate).
      - name: Enforce worker bundle size ceiling (1 MB gzip)
        run: |
          SIZE_BYTES=$(gzip -c dist/client/_worker.js | wc -c)
          # Pure integer bash arithmetic (no `bc` dependency) — two
          # decimal places via scaled integer division.
          SIZE_MB=$(( (SIZE_BYTES * 100) / 1048576 ))
          echo "Worker bundle gzip size: ${SIZE_BYTES} bytes (~$(( SIZE_MB / 100 )).$(( SIZE_MB % 100 )) MB)"
          if [ "$SIZE_BYTES" -gt 1048576 ]; then
            echo "::error::Worker bundle exceeds the 1 MB gzip ceiling (CF Pages hard limit)."
            exit 1
          fi

  test:
    name: Test suite
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Reworked 19 Oct 2026. The default `npx playwright test` is now safe by construction: playwright.config.ts
      # matches only the specs classed "pure" (no network, no database) in tests/spec-classes.json, so it can never
      # touch production. The other specs (61 live ones that hit production, create fixtures or need the service
      # role) run only when CWL_FIXTURES_READY=1, which CI never sets. The guard below fails the build if that
      # classification or the config gate drifts.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node scripts/check-live-specs.mjs
      - name: Run the safe (pure) specs
        run: npx playwright test

  accessibility:
    name: Accessibility scan (axe-core, report-only)
    runs-on: ubuntu-latest
    needs: build
    # The scanned routes are public and never call the backend, but the app throws at start-up when its public
    # Supabase URL and anon key are empty (src/lib/supabase.ts). These are non-secret placeholders: the host is
    # on the reserved .invalid TLD, so nothing can ever be reached with them. NEVER put a service-role key or any
    # real secret in this job. Vite bakes the VITE_ values in at build time, so they only need to be present for
    # the build step.
    env:
      VITE_SUPABASE_URL: "https://ci-placeholder.invalid"
      VITE_SUPABASE_ANON_KEY: "ci-placeholder-anon-key"
      # Cloudflare's published always-pass Turnstile TEST site key (not a secret): lets the build include the
      # widget wiring. The captcha tests below replace the Turnstile script with a stub anyway.
      VITE_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Chromium only — the existing playwright.config.ts already scopes
      # to a single "chromium" project, so this matches what's already
      # the real target rather than installing all three engines.
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Serve THIS build locally — wrangler pages dev, never `vite dev`
      # (see CLAUDE.md's standing rule: dev-server behavior and the real
      # worker's behavior have been found to differ before). Same
      # pattern this project already uses for every manual live-build
      # check all session: build, clear stale local wrangler state,
      # serve, poll for a real 200 before running anything against it —
      # rather than a fixed sleep, which is exactly what caused a
      # connection-refused flake earlier in this same session.
      - name: Start local preview server (wrangler pages dev)
        run: |
          rm -rf .wrangler dist/.wrangler
          npx wrangler pages dev dist/client --port 8788 --compatibility-date=2024-09-23 \
            > /tmp/wrangler-a11y.log 2>&1 &
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8788/ || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "Server up after ${i}s (HTTP 200)."
              exit 0
            fi
            sleep 1
          done
          echo "::error::wrangler pages dev never returned 200 within 30s."
          cat /tmp/wrangler-a11y.log
          exit 1
      # tests/a11y-scan.spec.ts scopes itself to 5 unauthenticated routes
      # and NEVER asserts on violations — see that file's own header.
      # This step prints the full report to the job log; it does not
      # gate the build. A11Y_SCAN_BASE_URL overrides the spec's default
      # localhost target, matching where this job's own server listens
      # (playwright.config.ts's baseURL is hardcoded to production and
      # is deliberately not used here — see the spec file header).
      - name: Run axe-core scan (report-only — never fails this job)
        env:
          A11Y_SCAN_BASE_URL: "http://localhost:8788"
        run: npx playwright test tests/a11y-scan.spec.ts --reporter=list
      # Captcha wiring (sign-in, reset, new password) against THIS build. Nothing leaves the runner: the Turnstile
      # script is stubbed and every Supabase request is intercepted. Unlike the scan above, this one gates the job.
      - name: Captcha wiring tests (stubbed widget, intercepted auth requests)
        env:
          A11Y_SCAN_BASE_URL: "http://localhost:8788"
        run: npx playwright test tests/auth-captcha.spec.ts --reporter=list

  dependency-audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Critical findings in PRODUCTION dependencies fail this job (added 19 Oct 2026, after the TanStack Start
      # reflected-XSS advisory GHSA-qx66-fv34-fjm8 was fixed and the production count reached 0 critical).
      # `--omit=dev` skips dev-only packages; `--audit-level=critical` makes npm exit non-zero only for critical.
      # What stays unblocked: high and lower findings, which are build and deploy tooling (wrangler, miniflare,
      # undici, ws, sharp, @cloudflare/vite-plugin) that does not ship in the deployed bundle; they are reported
      # by the next step.
      - name: npm audit (production, fails on critical)
        run: npm audit --omit=dev --audit-level=critical
      # `npm audit` exits non-zero on ANY finding at any severity — real findings exist in this project today.
      # This second step is report-only: continue-on-error makes it show as failed/red in the PR checks list
      # (visible, not hidden) without blocking merge.
      - name: npm audit (all severities, report only, non-blocking)
        continue-on-error: true
        run: npm audit --audit-level=low
